# Upstream Tomcat backend with connection pooling
upstream tomcat_backend {
    server app:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 1. HTTP -> HTTPS Permanent Redirection (and ACME Challenge for Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name api.samaaj.in app.samaaj.in civiclink.in *.civiclink.in;

    # Let's Encrypt domain validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all plain HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (TLS Termination with Forwarded Headers)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.samaaj.in app.samaaj.in civiclink.in *.civiclink.in;

    # ── SSL Certificates ──
    # Replace paths with real Certbot / Cloud certificates in production
    ssl_certificate /etc/letsencrypt/live/samaaj.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samaaj.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/samaaj.in/chain.pem;

    # ── Modern TLS Configuration (Mozilla Intermediate Standard) ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Caching
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ──
    # Note: Tomcat also provides HSTS; Nginx reinforces it at the edge
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:;" always;

    # ── API & Tomcat Reverse Proxy ──
    location / {
        limit_req zone=api_gateway_limit burst=30 nodelay;

        proxy_pass http://tomcat_backend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Crucial Reverse Proxy Headers for Spring Boot's forward-headers-strategy: framework
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # Internal health probe bypass (for AWS ALB / Docker health checks without rate limiting)
    location = /actuator/health {
        proxy_pass http://tomcat_backend/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
