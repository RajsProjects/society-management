apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: society-management-hpa
  namespace: society-management
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: society-management
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80