apiVersion: apps/v1
kind: Deployment
metadata:
  name: society-management
  namespace: society-management
  labels:
    app: society-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: society-management
  template:
    metadata:
      labels:
        app: society-management
    spec:
      containers:
        - name: society-management
          image: society-management:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: society-secrets
                  key: MONGODB_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: society-secrets
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: society-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3