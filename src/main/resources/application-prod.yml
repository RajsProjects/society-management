server:
  port: ${PORT:${SERVER_PORT:8081}}
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

security:
  pepper: ${SECURITY_PEPPER}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

springdoc:
  api-docs:
    path: /api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false
    redis:
      enabled: false

logging:
  level:
    root: INFO
    com.Application.SocietyManagement: INFO

# AWS
aws:
  region: ap-south-1
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket: civiclink-documents
    presigned-url-expiry: 3600  # 1 hour

# Razorpay
razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
  currency: INR
  plans:
    basic:
      amount: 99900      # ₹999 in paise
      flats-limit: 50
    growth:
      amount: 249900     # ₹2499 in paise
      flats-limit: 200
    scale:
      amount: 499900     # ₹4999 in paise
      flats-limit: 500

# Platform
platform:
  trial-days: 14
  join-code-prefix: SOC
  support-email: support@civiclink.in
  admin:
    email: ${PLATFORM_ADMIN_EMAIL}
    password: ${PLATFORM_ADMIN_PASSWORD}
