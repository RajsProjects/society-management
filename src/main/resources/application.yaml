server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    threads:
      max: 1000
      min-spare: ${TOMCAT_MIN_SPARE:20}
    accept-count: 5000
    max-connections: 20000
    connection-timeout: 30000ms
    keep-alive-timeout: 60000ms
    max-keep-alive-requests: 20000
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,application/xml
    min-response-size: 1024

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

security:
  pepper: ${SECURITY_PEPPER}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:2000}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500}

spring:
  main:
    banner-mode: "off"
    lazy-initialization: ${SPRING_LAZY_INIT:true}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: ${MONGO_AUTO_INDEX_CREATION:false}
      pool:
        max-size: ${MONGO_POOL_MAX_SIZE:300}
        min-size: ${MONGO_POOL_MIN_SIZE:50}
        max-wait-time-ms: ${MONGO_POOL_MAX_WAIT_MS:10000}
        max-idle-time-ms: ${MONGO_POOL_MAX_IDLE_MS:30000}
    redis:
      repositories:
        enabled: false
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms
    connect-timeout: 2000ms
    lettuce:
      pool:
        max-active: ${REDIS_POOL_MAX_ACTIVE:64}
        max-idle: ${REDIS_POOL_MAX_IDLE:16}
        min-idle: ${REDIS_POOL_MIN_IDLE:4}
        max-wait: 2000ms
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
       mail:
         smtp:
           auth: true
           starttls:
             enable: true
             required: true
         connectiontimeout: 5000
         timeout: 5000
         writetimeout: 5000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 50ms, 100ms, 250ms, 500ms, 1000ms, 2000ms

logging:
  level:
    org.springframework.security: WARN

aws:
  region: ap-south-1
  access-key: ${AWS_ACCESS_KEY_ID:dummy}
  secret-key: ${AWS_SECRET_ACCESS_KEY:dummy}
  s3:
    bucket: civiclink-documents-dev
    presigned-url-expiry: 3600

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_dummy}
  key-secret: ${RAZORPAY_KEY_SECRET:dummy}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:dummy}
  currency: INR
  plans:
    basic:
      amount: 99900
      flats-limit: 50
    growth:
      amount: 249900
      flats-limit: 200
    scale:
      amount: 499900
      flats-limit: 500

platform:
  trial-days: 14
  join-code-prefix: SOC
  support-email: support@civiclink.in
  admin:
    email: ${PLATFORM_ADMIN_EMAIL:admin@civiclink.local}
    password: ${PLATFORM_ADMIN_PASSWORD:ChangeMe123!}

subscription:
  enforcement:
    enabled: ${SUBSCRIPTION_ENFORCEMENT_ENABLED:false}
  scheduler:
    enabled: ${SUBSCRIPTION_SCHEDULER_ENABLED:false}