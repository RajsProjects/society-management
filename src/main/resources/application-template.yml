server:
  port: 8080

jwt:
  secret: YOUR_JWT_SECRET_HERE_MIN_32_CHARS
  expiration: 86400000

spring:
  data:
    mongodb:
      uri: mongodb+srv://user:pass@cluster.mongodb.net/Society_DB?retryWrites=true&w=majority&connectTimeoutMS=10000&socketTimeoutMS=10000&maxPoolSize=50&minPoolSize=5
  jackson:
    serialization:
      write-dates-as-timestamps: false
    mapper:
      accept-case-insensitive-enums: true
    mail:
      host: smtp.gmail.com
      port: 587
      username: YOUR_GMAIL_ADDRESS
      password: YOUR_GMAIL_APP_PASSWORD

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    org.springframework.security: WARN